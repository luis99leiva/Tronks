<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Expenses Tronks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#141414; --ink-2:#3A3A3A; --muted:#6E6E6E; --line:#E6E6E6; --field:#FFFFFF; --soft:#F4F4F2;
  --brand:#4A1419; --brand-ink:#FFFFFF; --save:#4B7A4A; --save-ink:#FFFFFF;
  --u1:#8C1D1D; --u1-soft:#F7E9E7; --u1-bar:#8C1D1D;
  --u2:#B85A33; --u2-soft:#FBEDE5; --u2-bar:#E07B4F;
  --s-soft:#F3F4DF; --s-bar:#E1E38A; --s-ink:#5E6128;
  --track:#EFEFEF; --scrim:rgba(80,80,80,.55);
  --ok:#3D7A43; --warn:#9A5A14; --warn-soft:#FBF1E1;
  --serif:"EB Garamond","Cormorant Garamond",Garamond,"Times New Roman",serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1E1E1E; --paper:#1E1E1E; --ink:#F3F3F1; --ink-2:#D6D6D2; --muted:#9A9A96; --line:#343434; --field:#252525; --soft:#262626;
  --brand:#4A1A1D; --brand-ink:#F2C6C6; --save:#4B7A4A; --save-ink:#FFFFFF;
  --u1:#E58A84; --u1-soft:#3A2323; --u1-bar:#B8403C;
  --u2:#EFA07C; --u2-soft:#3B2A22; --u2-bar:#E07B4F;
  --s-soft:#2E2F22; --s-bar:#D9DB82; --s-ink:#DADC8C;
  --track:#2E2E2E; --scrim:rgba(0,0,0,.6);
  --ok:#86C68C; --warn:#E5A860; --warn-soft:#352A1C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E1E1E; --paper:#1E1E1E; --ink:#F3F3F1; --ink-2:#D6D6D2; --muted:#9A9A96; --line:#343434; --field:#252525; --soft:#262626;
  --brand:#4A1A1D; --brand-ink:#F2C6C6; --save:#4B7A4A; --save-ink:#FFFFFF;
  --u1:#E58A84; --u1-soft:#3A2323; --u1-bar:#B8403C;
  --u2:#EFA07C; --u2-soft:#3B2A22; --u2-bar:#E07B4F;
  --s-soft:#2E2F22; --s-bar:#D9DB82; --s-ink:#DADC8C;
  --track:#2E2E2E; --scrim:rgba(0,0,0,.6);
  --ok:#86C68C; --warn:#E5A860; --warn-soft:#352A1C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;margin:0;text-wrap:balance}
.muted{color:var(--muted)}

/* ---- Top nav ---- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:1320px;margin:0 auto;padding-inline:24px;height:72px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;margin-right:auto}
.logo svg{width:28px;height:28px}
.logo span{white-space:nowrap;font-family:var(--serif);font-size:25px;letter-spacing:-.01em}
.links{display:flex;gap:34px;align-self:stretch}
.links button{background:none;border:0;padding:0;font-size:15px;color:var(--ink);position:relative;display:flex;align-items:center}
.links button[aria-current="true"]{color:var(--ink);font-weight:500}
.links button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.pill{white-space:nowrap;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.pill:hover{background:var(--soft)}
.pill.icon{width:48px;padding:0;justify-content:center}
.pill.brand{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.pill.brand:hover{filter:brightness(1.1);background:var(--brand)}
.pill svg{width:18px;height:18px}
@media (max-width:760px){.links{display:none}.nav-in{padding-inline:16px;height:64px}.logo span{font-size:21px}.pill.brand{padding:0 12px;font-size:14px}.pill.icon{width:42px}}

.page{max-width:1320px;margin:0 auto;padding-inline:24px;padding-block:0 120px}
@media (max-width:760px){.page{padding-inline:16px}}

/* ---- Buttons ---- */
.btn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--paper);padding:0 26px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--soft);border-color:var(--line)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.save{background:var(--save);color:var(--save-ink);border-color:transparent}
.btn.danger{color:var(--u1)}
.btn.sm{height:42px;padding:0 18px;border-radius:12px}

/* ---- Home ---- */
.hero{text-align:center;padding-block:72px 44px}
.hero h1{font-size:clamp(34px,4.6vw,48px)}
.hero p{margin:10px auto 0;color:var(--muted);max-width:52ch}
.cells{max-width:1248px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.cell{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;padding:40px 44px 40px;background:var(--paper);border:0;border-right:1px solid var(--line);min-width:0;cursor:pointer;position:relative}
.cell:last-child{border-right:0}
.cell:hover{background:var(--soft)}
.cell.over{background:var(--u2-soft)}
.cell .ill{width:108px;height:108px;margin-bottom:30px}
.cell .t{font-size:17px;color:var(--ink);display:flex;align-items:center;gap:6px}
.cell .d{font-size:14.5px;color:var(--muted)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.thumb{position:relative;width:54px;height:70px;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1;padding:0}
@media (max-width:860px){.cells{grid-template-columns:1fr}.cell{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:18px;padding:22px}.cell:last-child{border-bottom:0}.cell .ill{width:64px;height:64px;margin:0;flex:none}.cell .txt{min-width:0}}
.readbar{max-width:1248px;margin:18px auto 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.progress{display:flex;gap:10px;align-items:center;color:var(--ink-2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.err{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14px;max-width:1248px;margin:18px auto 0}

.section{max-width:1248px;margin:84px auto 0}
.section > h2{font-size:32px}
.section > .sub{color:var(--muted);margin:6px 0 22px}
.hrow{width:100%;text-align:left;background:none;border:0;border-radius:0;color:inherit;cursor:pointer;display:grid;grid-template-columns:1fr auto auto;gap:6px 24px;align-items:center;padding:22px 0;border-top:1px solid var(--line)}
.hrow:last-child{border-bottom:1px solid var(--line)}
.hrow:hover .btn{background:var(--soft)}
.hrow .k{font-size:13px;color:var(--muted)}
.hrow .v{font-size:16px;margin-top:2px}
.hrow .who{display:flex;gap:14px;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.u1{background:var(--u1-bar)} .dot.u2{background:var(--u2-bar)} .dot.off{background:var(--line)}
@media (max-width:640px){.hrow{grid-template-columns:1fr auto}.hrow .who{grid-column:1 / -1;order:3}}

/* ---- Factura (two columns) ---- */
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(32px,6vw,120px);padding-top:56px}
@media (max-width:960px){.split{grid-template-columns:1fr;padding-top:28px}}
.left h1{font-size:clamp(36px,4.2vw,50px);line-height:1.1}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:6px}
.stepline{font-family:var(--serif);font-size:clamp(20px,2vw,24px);color:var(--ink-2);margin:14px 0 0;max-width:40ch;line-height:1.35}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;border-radius:9px;padding:8px 16px;background:transparent;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.who button[aria-pressed="true"].u1{color:var(--u1)}
.seg.who button[aria-pressed="true"].u2{color:var(--u2)}
.marking{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.marking .l{font-size:14px;color:var(--muted)}

.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:48px 0 16px;gap:12px}
.listhead h2{font-size:34px}
.listhead .n{color:var(--muted);font-size:17px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.items{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:10px 22px 10px 10px;transition:border-color .15s,background .15s}
.item:hover:not(.locked):not(.u1):not(.u2){border-color:var(--muted)}
.tile{width:84px;height:84px;border-radius:16px;background:var(--s-soft);display:grid;place-items:center;font-family:var(--serif);font-size:34px;color:var(--s-ink);line-height:1;position:relative}
.tile small{position:absolute;bottom:7px;right:9px;font-family:var(--sans);font-size:11.5px;font-weight:600}
.item .nm{font-size:16px;color:var(--ink);overflow-wrap:anywhere}
.item .sub{font-size:14.5px;color:var(--muted);margin-top:2px}
.item .am{font-size:16px;text-align:right;white-space:nowrap}
.item.u1{border-color:var(--u1-bar)} .item.u1 .tile{background:var(--u1-soft);color:var(--u1)} .item.u1 .sub{color:var(--u1)}
.item.u2{border-color:var(--u2-bar)} .item.u2 .tile{background:var(--u2-soft);color:var(--u2)} .item.u2 .sub{color:var(--u2)}
.item.locked{opacity:.5;cursor:default}
.item.mix{border-color:var(--muted);border-style:dashed}
.item .hintx{color:var(--muted)}
.itemwrap{display:flex;flex-direction:column}
.itemwrap.open .item{border-bottom-left-radius:0;border-bottom-right-radius:0}
.splitpanel{border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;padding:16px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;background:var(--soft)}
.splitpanel .q{font-size:15px}
.splitpanel .rest{font-size:14px}
.splitpanel .quick{display:flex;gap:8px;margin-left:auto}
.c-u1{color:var(--u1)} .c-u2{color:var(--u2)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.stepper button{width:44px;height:42px;border:0;background:none;font-size:20px;line-height:1}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper b{min-width:36px;text-align:center;font-family:var(--serif);font-size:24px;font-weight:400}
@media (max-width:520px){.tile{width:60px;height:60px;font-size:26px;border-radius:12px}.item{gap:12px;padding:8px 14px 8px 8px;border-radius:18px}}
.discount .num{white-space:nowrap}
.discount{display:flex;justify-content:space-between;padding:18px 4px 0;color:var(--muted);font-size:14.5px;gap:12px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px;align-items:center}
.actions .grow{margin-left:auto}

.right{position:sticky;top:calc(72px + env(safe-area-inset-top,0px) + 24px);align-self:start;display:flex;flex-direction:column;gap:44px}
@media (max-width:960px){.right{position:static}}
.right h2{font-size:clamp(30px,3vw,38px)}
.payrows{margin-top:24px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.payrow:last-child{border-bottom:1px solid var(--line)}
.payrow .name{font-size:16px;display:flex;align-items:center}
.payrow .st{font-size:13px;color:var(--muted);margin-left:10px}
.payrow .amt{font-family:var(--serif);font-size:26px;white-space:nowrap}

.chartcard{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--paper)}
.chart-top{padding:40px 24px 30px;text-align:center;border-bottom:1px solid var(--line)}
.bignum{font-family:var(--serif);font-size:clamp(52px,6vw,76px);line-height:1;letter-spacing:-.02em}
.bignum small{font-size:.38em;color:var(--muted);margin-right:6px;letter-spacing:0}
.chart-top .seg{margin-top:18px}
.bars{padding:30px 32px 26px;display:flex;flex-direction:column;gap:24px}
.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 48px;gap:18px;align-items:center;font-size:14.5px}
.bar-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .pct{text-align:right;color:var(--ink-2)}
.track{display:block;height:9px;border-radius:9px;background:var(--track);overflow:hidden}
.fill{display:block;height:100%;border-radius:9px;transition:width .35s ease}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.fill.u1{background:var(--u1-bar)} .fill.u2{background:var(--u2-bar)} .fill.s{background:var(--s-bar)}
@media (max-width:520px){.bar-row{grid-template-columns:1fr 44px;gap:6px 12px}.bar-row .track{grid-column:1 / -1;order:3}.bars{padding:24px 20px}}
.chart-foot{padding:16px 24px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.chart-foot.ok{color:var(--ok)}
.chart-foot.bad{color:var(--warn);background:var(--warn-soft)}

/* mobile pay bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:10px}
.mbar > div{flex:1;border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:0}
.mbar .l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .v{font-family:var(--serif);font-size:22px;line-height:1.1;white-space:nowrap}
@media (max-width:960px){.mbar.on{display:flex}}

/* ---- Drawer ---- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;background:var(--paper);border-radius:28px 0 0 0;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.drawer .body{flex:1;overflow:auto;padding:44px 22px 24px;display:flex;flex-direction:column;gap:22px}
.drawer h2{font-size:40px}
.drawer .lead{color:var(--muted);margin:-14px 0 0}
.drawer h3{font-family:var(--sans);font-size:18px;font-weight:500;letter-spacing:0}
.drawer .foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 22px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.drawer .foot .btn{height:60px;border-radius:16px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:10px;min-width:0}
.field label{font-size:14.5px;font-weight:500}
.field label i{font-style:normal;color:var(--u1)}
.input{height:56px;border:1px solid var(--line);border-radius:16px;padding:0 20px;background:var(--field);font-size:16px;width:100%;min-width:0}
.erow{display:grid;grid-template-columns:64px 1fr 130px 40px;gap:8px;align-items:center}
.erow .input{height:48px;border-radius:12px;padding:0 12px;font-size:15px}
.erow .input.n{text-align:right;font-variant-numeric:tabular-nums}
.erow .x{border:1px solid var(--line);border-radius:12px;height:48px;background:none;color:var(--u1);font-size:18px}
.ehead{display:grid;grid-template-columns:64px 1fr 130px 40px;gap:8px;font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.erow,.ehead{grid-template-columns:48px 1fr 96px 36px;gap:6px}}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--ink);border-radius:14px;padding:10px 20px;background:var(--paper);font-size:15.5px}

.login{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.login .btn{width:100%}
.files{display:flex;flex-direction:column;gap:8px}
.filerow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--paper);font-size:14.5px}
.filerow:hover{background:var(--soft)}
.filerow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .ft{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:30}
</style>

<header class="nav">
  <div class="nav-in">
    <button class="logo" type="button" data-go="home" aria-label="Expenses Tronks, inicio">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M13 3a11 11 0 0 0 0 22z" fill="var(--u1-bar)"/><path d="M15 3a11 11 0 0 1 0 22z" fill="var(--u2-bar)"/></svg>
      <span>Expenses Tronks</span>
    </button>
    <nav class="links" aria-label="Secciones">
      <button type="button" data-go="names">Nombres</button>
    </nav>
    <div class="tools">
      <button class="pill brand" type="button" data-go="upload">Subir factura</button>
      <button class="pill" type="button" id="logoutBtn" hidden>Salir</button>
      <button class="pill icon" type="button" id="themeBtn" aria-label="Cambiar tema"></button>
    </div>
  </div>
</header>
<main class="page" id="view"></main>
<div class="mbar" id="mbar"></div>
<div class="scrim" id="drawer" hidden></div>
<div class="toast" id="toast" hidden></div>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,.xml,text/xml,application/xml" multiple hidden>
<input id="attach" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,.xml,text/xml,application/xml" multiple hidden>

<script>

/* Cuántas unidades de un ítem son de cada uno. assign puede ser "u1", "u2", "s" o {u1: n, u2: m}; el resto es compartido. */
function portions(f, it) {
  const q = qtyOf(it), v = rawAssign(f, it.id);
  let a = 0, b = 0;
  if (v === "u1") a = q; else if (v === "u2") b = q;
  else if (v && typeof v === "object") { a = Math.max(0, Math.min(q, toInt(v.u1))); b = Math.max(0, Math.min(q - a, toInt(v.u2))); }
  return { q, u1: a, u2: b, s: q - a - b };
}
function ownerOf(f, itemId) {

  const p = portions(f, it);
  return p.u1 === p.q ? "u1" : p.u2 === p.q ? "u2" : p.s === p.q ? "s" : "mix";
}
function setMine(f, it, n) {
  const me = S.me, other = me === "u1" ? "u2" : "u1", p = portions(f, it);
  n = Math.max(0, Math.min(p.q - p[other], n));

  if (n === p.q) val = me; else if (p[other] === p.q) val = other;
  else if (n === 0 && p[other] === 0) val = "s";
  else val = { [me]: n, [other]: p[other] };
  queueAssign(f.id, it.id, val);
}

function makeDb(sb) {
  const where = p => { const [col, id] = p.split("/"); return { t: col === "facturas" ? "facturas" : "config", id }; };
  const merge = (cur, patch) => { const m = { ...cur }; for (const [k, v] of Object.entries(patch)) m[k] = v && typeof v === "object" && !Array.isArray(v) ? { ...(m[k] || {}), ...v } : v; return m; };
  const chk = r => { if (r.error) throw r.error; return r; };
  const listeners = { facturas: new Set(), config: new Set() };
  const fire = t => listeners[t].forEach(fn => fn());
  sb.channel("tronks-cambios")
    .on("postgres_changes", { event: "*", schema: "public", table: "facturas" }, () => fire("facturas"))
    .on("postgres_changes", { event: "*", schema: "public", table: "config" }, () => fire("config"))
    .subscribe();
  addEventListener("focus", () => { fire("facturas"); fire("config"); });
  return {
    doc(path) {
      const { t, id } = where(path);
      return {
        async set(body) { chk(await sb.from(t).upsert({ id, data: body })); fire(t); },
        async update(patch) {
          const { data } = chk(await sb.from(t).select("data").eq("id", id).maybeSingle());
          chk(await sb.from(t).upsert({ id, data: merge(data?.data || {}, JSON.parse(JSON.stringify(patch))) }));
          fire(t);
        },
        async delete() { chk(await sb.from(t).delete().eq("id", id)); fire(t); },
        onSnapshot(cb, err) {
          const run = async () => { const { data, error } = await sb.from(t).select("data").eq("id", id).maybeSingle(); if (error) return err?.(error); cb({ exists: !!data, data: () => data?.data }); };
          listeners[t].add(run); run();
        }
      };
    },
    collection(name) {
      return {
        onSnapshot(cb, err) {
          const run = async () => { const { data, error } = await sb.from(name).select("id,data"); if (error) return err?.(error); cb({ docs: data.map(r => ({ id: r.id, data: () => r.data })) }); };
          listeners[name].add(run); run();
        }
      };
    }
  };
}

async function uploadFiles(fid, list) {
  if (!sb || S.auth !== "in" || !list.length) return [];
  const out = [];
  for (const x of list) {
    const file = x.file || x;
    if (file.size > MAX_FILE) { toast(`"${file.name}" pesa más de 10 MB y no se guardó.`); continue; }
    const isXml = /xml/.test(file.type) || /\.xml$/i.test(file.name);
    const safe = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w.\-]+/g, "_").slice(-80);
    const path = `${fid}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${safe}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || (isXml ? "application/xml" : "application/octet-stream") });
    if (error) { toast(`No se pudo guardar "${file.name}".`); continue; }
    out.push({ path, nombre: file.name, tipo: isXml ? "XML" : file.type === "application/pdf" ? "PDF" : "IMG", tam: file.size });
  }
  return out;
}

/* ---------- persistence ---------- */
function chain(fid, fn) { const p = (writeChain[fid] || Promise.resolve()).then(fn, fn); writeChain[fid] = p.catch(() => {}); return p; }
async function saveFactura(f) {
  if (f.example) return;
  const body = JSON.parse(JSON.stringify(f)); delete body.id;
  if (!db) { memStore[f.id] = body; syncMem(); return; }
  try { await chain(f.id, () => db.doc("facturas/" + f.id).set(body)); }
  catch (e) { toast(e?.code === "quota_exceeded" ? "Se llenó el espacio. Borrá facturas viejas." : "No se pudo guardar. Probá de nuevo."); }
}
async function patchFactura(fid, patch) {
  const f = getF(fid); if (!f || f.example) { for (const [k, v] of Object.entries(patch)) EXAMPLE[k] = v && typeof v === "object" && !Array.isArray(v) ? { ...(EXAMPLE[k] || {}), ...v } : v; return; }
  if (!db) { const m = memStore[fid]; for (const [k, v] of Object.entries(JSON.parse(JSON.stringify(patch)))) m[k] = v && typeof v === "object" && !Array.isArray(v) ? { ...(m[k] || {}), ...v } : v; syncMem(); return; }
  try { await chain(fid, () => db.doc("facturas/" + fid).update(patch)); }
  catch { toast("No se pudo guardar el cambio."); }
}
function queueAssign(fid, itemId, val) {
  if (fid === "ejemplo") { EXAMPLE.assign[itemId] = val; return; }
  (pendingAssign[fid] ||= {})[itemId] = val;
  clearTimeout(queueAssign["t" + fid]);
  queueAssign["t" + fid] = setTimeout(async () => {
    const batch = pendingAssign[fid]; if (!batch) return;
    const f = getF(fid); if (f) f.assign = { ...(f.assign || {}), ...batch };
    await patchFactura(fid, { assign: batch });
    if (pendingAssign[fid] === batch) delete pendingAssign[fid];
  }, 450);
}
async function deleteFactura(fid, paths = []) {
  if (sb && paths.length) { try { await sb.storage.from(BUCKET).remove(paths); } catch {} }
  if (!db) { delete memStore[fid]; syncMem(); return; }
  try { await db.doc("facturas/" + fid).delete(); } catch { toast("No se pudo borrar."); }
}
async function saveNames(names) {
  S.names = names; render();
  if (db) { try { await db.doc("config/general").set({ names }); } catch { toast("No se pudieron guardar los nombres."); } }
}
function syncMem() { S.facturas = Object.entries(memStore).map(([id, d]) => ({ id, ...JSON.parse(JSON.stringify(d)) })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); render(); }

/* ---------- math ---------- */
function calc(f) {
  const sums = { s: 0, u1: 0, u2: 0 };
  for (const it of f.items || []) { const p = portions(f, it), unit = toInt(it.monto) / p.q; sums.s += unit * p.s; sums.u1 += unit * p.u1; sums.u2 += unit * p.u2; }
  const bruto = sums.s + sums.u1 + sums.u2;
  const desc = toInt(f.descuentoGeneral);
  const factor = bruto > 0 ? (bruto - desc) / bruto : 1;
  const net = { s: sums.s * factor, u1: sums.u1 * factor, u2: sums.u2 * factor };
  const total = Math.round(bruto - desc);
  let p1 = Math.round(net.u1 + net.s / 2);
  let p2 = total - p1;
  return { sums, bruto, desc, net, total, p1, p2, factor,
           d: { s: sums.s - net.s, u1: sums.u1 - net.u1, u2: sums.u2 - net.u2 } };
}

/* ---------- reading the invoice ---------- */
const PROMPT = `Sos un lector de facturas y tickets de supermercado de Paraguay. Te paso el contenido de UNA factura (imágenes, texto extraído de un PDF o el XML de una factura electrónica). Si hay varias imágenes, son partes consecutivas de la MISMA factura y pueden superponerse un poco: no dupliques un producto que aparece en el borde de dos partes.

Extraé todos los productos comprados. Montos en guaraníes enteros: "12.500" significa 12500 (el punto es separador de miles).

Respondé SOLO con JSON con esta forma exacta:
{"comercio": string o null, "fecha": "AAAA-MM-DD" o null, "items": [{"nombre": string, "cantidad": number, "monto": integer}], "descuentoGeneral": integer, "totalImpreso": integer o null}

Reglas:
- "monto" es el total de la línea (cantidad × precio unitario), ya restando cualquier descuento o promoción que corresponda a ESE producto (si el descuento aparece en una línea aparte debajo del producto, restáselo a ese producto y no lo pongas como ítem).
- Productos pesados (kg): cantidad 1 y el monto de la línea.
- "descuentoGeneral": descuentos que aplican a toda la compra y no a un producto (número positivo, 0 si no hay).
- NO incluyas como ítems: subtotales, IVA, totales, vuelto, efectivo, tarjeta, redondeo, puntos.
- "nombre": legible, expandí abreviaturas obvias y mantené la marca. En español.
- "totalImpreso": el TOTAL a pagar que figura en la factura.
- Si un monto no se lee bien, poné tu mejor lectura.`;

let ctl = null;
async function pdfToParts(file) {
  await loadScript(PDFJS); await loadScript(PDFW);
  const lib = window.pdfjsLib;
  try { lib.GlobalWorkerOptions.workerSrc = PDFW; } catch {}
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const n = Math.min(doc.numPages, 6);
  let text = ""; const pages = [];
  for (let p = 1; p <= n; p++) {
    const page = await doc.getPage(p); pages.push(page);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5] / 3), x = it.transform[4];
      let r = rows.find(r => r.y === y); if (!r) rows.push(r = { y, parts: [] });
      r.parts.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    text += `--- Página ${p} ---\n` + rows.map(r => r.parts.sort((a, b) => a.x - b.x).map(q => q.s).join("  ")).join("\n") + "\n";
  }
  if (text.replace(/---.*---/g, "").trim().length > 120) return { text: text.slice(0, 40000), images: [] };
  const images = [];
  for (const page of pages) {
    const vp = page.getViewport({ scale: 2 });
    const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    images.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.9)));
  }
  return { text: "", images };
}
async function sliceTall(file, maxPieces) {
  // Tickets largos: se cortan en partes para que el texto no pierda resolución.
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const w = img.naturalWidth, h = img.naturalHeight;
  const ratio = h / w;
  let pieces = Math.min(maxPieces, Math.max(1, Math.ceil(ratio / 1.5)));
  if (pieces <= 1) return [file];
  const step = h / pieces, ov = Math.round(step * 0.06);
  const out = [];
  for (let i = 0; i < pieces; i++) {
    const y0 = Math.max(0, Math.round(i * step - ov)), y1 = Math.min(h, Math.round((i + 1) * step + ov));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = y1 - y0;
    cv.getContext("2d").drawImage(img, 0, y0, w, y1 - y0, 0, 0, w, y1 - y0);
    out.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.9)));
  }
  return out;
}
/* XML de factura electrónica (SIFEN, Paraguay). Se lee directo, sin IA. */
function xmlTag(el, name) { const n = el.getElementsByTagNameNS("*", name)[0] || el.getElementsByTagName(name)[0]; return n ? n.textContent.trim() : ""; }
function xmlAll(el, name) { const a = el.getElementsByTagNameNS("*", name); return a.length ? [...a] : [...el.getElementsByTagName(name)]; }
function parseSifen(raw) {
  let doc;
  try { doc = new DOMParser().parseFromString(raw, "application/xml"); } catch { return null; }
  if (!doc || doc.getElementsByTagName("parsererror").length) return null;
  const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
  const items = xmlAll(doc, "gCamItem").map(it => {
    const qty = num(xmlTag(it, "dCantProSer")) || 1;
    let monto = num(xmlTag(it, "dTotOpeItem")) || num(xmlTag(it, "dTotBruOpeItem"));
    if (!monto) monto = num(xmlTag(it, "dPUniProSer")) * qty;
    return { nombre: xmlTag(it, "dDesProSer") || "Producto", cantidad: qty, monto: Math.round(monto) };
  }).filter(it => it.monto);
  if (!items.length) return null;
  return {
    comercio: xmlTag(doc, "dNomFanEmi") || xmlTag(doc, "dNomEmi") || "Súper",
    fecha: (xmlTag(doc, "dFeEmiDE") || "").slice(0, 10),
    items, descuentoGeneral: 0,
    totalImpreso: Math.round(num(xmlTag(doc, "dTotGralOpe"))) || null
  };
}
function compactXml(raw) {
  return raw.replace(/<([\w-]+:)?Signature[\s\S]*?<\/([\w-]+:)?Signature>/g, "")
            .replace(/<([\w-]+:)?gCamFuFD[\s\S]*?<\/([\w-]+:)?gCamFuFD>/g, "")
            .replace(/>\s+</g, "><").slice(0, 40000);
}
async function readInvoice() {
  if (!S.files.length) return;
  const xmlFiles = S.files.filter(f => f.type === "xml"), others = S.files.filter(f => f.type !== "xml");
  if (!sample && others.length) return;
  S.error = null; S.busy = "Preparando archivos…"; render();
  ctl = new AbortController();
  try {
    const maxImg = limits?.images?.maxCount || 0;
    let text = "", images = [], r = null;
    for (const f of xmlFiles) {
      const raw = await f.file.text();
      const p = parseSifen(raw);
      if (p && xmlFiles.length === 1 && !others.length) r = p;
      else text += `\n--- XML ${f.file.name} ---\n` + compactXml(raw);
    }
    if (!r) {
      if (!sample) throw { code: "xml_unreadable" };
      const imgFiles = others.filter(f => f.type !== "application/pdf");
      for (const f of others.filter(f => f.type === "application/pdf")) {
        const x = await pdfToParts(f.file); text += x.text; images.push(...x.images);
      }
      if (imgFiles.length) {
        if (!maxImg) throw { code: "images_unavailable" };
        const budget = Math.max(1, Math.floor((maxImg - images.length) / imgFiles.length));
        for (const f of imgFiles) images.push(...(budget > 1 ? await sliceTall(f.file, Math.min(budget, 4)) : [f.file]));
      }
      if (images.length && !maxImg) throw { code: "images_unavailable" };
      images = images.slice(0, maxImg || 0);
      S.busy = "Leyendo la factura… (puede tardar hasta un minuto)"; render();
      const input = PROMPT + (text ? `\n\nContenido de la factura (texto de PDF o XML):\n${text.slice(0, 50000)}` : "\n\nLa factura está en las imágenes adjuntas.");
      const opts = { signal: ctl.signal };
      if (images.length) opts.images = images;
      r = await sample.json(input, opts);
    }
    if (!r || !Array.isArray(r.items) || !r.items.length) throw { code: "no_items" };
    const f = {
      id: uid(), createdAt: Date.now(),
      comercio: String(r.comercio || "Súper"), fecha: /^\d{4}-\d{2}-\d{2}$/.test(r.fecha || "") ? r.fecha : today(),
      items: r.items.map(it => ({ id: uid(), nombre: String(it.nombre || "Producto"), cantidad: Math.max(1, Math.round(Number(it.cantidad) || 1)), monto: toInt(it.monto) })).filter(it => it.monto !== 0 || it.nombre),
      descuentoGeneral: Math.max(0, toInt(r.descuentoGeneral)), totalImpreso: r.totalImpreso ? toInt(r.totalImpreso) : null,
      assign: {}, done: {}
    };
    S.facturas.unshift(f);
    const toUp = S.files.slice();
    S.files.forEach(x => x.url && URL.revokeObjectURL(x.url)); S.files = [];
    S.busy = null; S.view = "factura"; S.cur = f.id; S.filter = "all";
    render(); window.scrollTo(0, 0);
    await saveFactura(f);
    await attachTo(f, toUp);
  } catch (e) {
    S.busy = null;
    const m = {
      cancelled: null,
      not_granted: "No se dio permiso para usar Claude. Podés cargar los ítems a mano.",
      images_unavailable: "Esta vista no puede enviar imágenes a Claude. Probá con un PDF o cargá a mano.",
      image_rejected: "No se pudo leer esa imagen. Probá con otra foto (JPG o PNG) más nítida.",
      rate_limited: "Se alcanzó el límite de uso por ahora. Probá en un rato.",
      invalid_json: "La respuesta vino incompleta. Tocá \"Leer factura\" de nuevo.",
      no_items: "No se encontraron productos. Probá con una foto más nítida y derecha.",
      refused: "Claude no pudo procesar ese archivo. Probá con otra foto.",
      session_expired: "Tu sesión expiró. Volvé a iniciar sesión en Claude.",
      xml_unreadable: "No se pudo leer ese XML automáticamente y la lectura con IA no está disponible en esta vista. Usá \"Cargar a mano\"."
    };
    const msg = e?.code in m ? m[e.code] : (e?.message === "load" ? "No se pudo cargar el lector de PDF. Probá con una foto." : "Algo falló al leer la factura. Probá de nuevo.");
    S.error = msg; render();
  }
}
function addFiles(list) {
  for (const file of list) {
    const isXml = /xml/.test(file.type) || /\.xml$/i.test(file.name);
    const ok = isXml || /^image\/(jpeg|png|webp|gif)$/.test(file.type) || file.type === "application/pdf";
    if (!ok) { S.error = `"${file.name}" no es JPG, PNG, WebP, PDF ni XML. Si es una foto de iPhone (HEIC), exportala como JPG.`; continue; }
    const type = isXml ? "xml" : file.type;
    S.files.push({ file, type, url: type.startsWith("image/") ? URL.createObjectURL(file) : null });
  }
  render();
}

  if (t.dataset.close !== undefined) return closeDrawer();
  if (t.id === "readBtn") return readInvoice();
  if (t.id === "stopBtn") { ctl?.abort(); S.busy = null; render(); return; }
  if (t.id === "manualBtn") {
    const f = { id: uid(), createdAt: Date.now(), comercio: "Súper", fecha: today(), items: [], descuentoGeneral: 0, totalImpreso: null, assign: {}, done: {} };
    S.facturas.unshift(f); await saveFactura(f);
    const toUp = S.files.slice(); S.files.forEach(x => x.url && URL.revokeObjectURL(x.url)); S.files = []; S.error = null;
    S.view = "factura"; S.cur = f.id; S.filter = "all"; render(); window.scrollTo(0, 0); openEdit(f);
    attachTo(f, toUp); return;
  }
  if (t.dataset.open) { S.view = "factura"; S.cur = t.dataset.open; S.filter = "all"; S.big = "t"; S.confirmDel = false; render(); window.scrollTo(0, 0); return; }
  if (t.id === "addItem") { collectDraft(); S.draft.items.push({ id: uid(), nombre: "", cantidad: 1, monto: "" }); drawEdit(); const all = document.querySelectorAll('[data-e="nombre"]'); all[all.length - 1]?.focus(); return; }
  if (t.dataset.del !== undefined) { collectDraft(); S.draft.items.splice(+t.dataset.del, 1); drawEdit(); return; }
  const f = getF(S.editing || S.cur);
  if (!f) return;
  if (t.id === "saveEdit") {
    collectDraft();
    const d = S.draft;
    d.items = d.items.filter(it => String(it.nombre).trim() || toInt(it.monto)).map(it => ({ id: it.id, nombre: String(it.nombre).trim() || "Producto", cantidad: Math.max(1, toInt(it.cantidad) || 1), monto: toInt(it.monto) }));
    const keep = new Set(d.items.map(i => i.id));
    const assign = Object.fromEntries(Object.entries(f.assign || {}).filter(([k]) => keep.has(k)));
    Object.assign(f, { comercio: d.comercio, fecha: d.fecha, descuentoGeneral: Math.max(0, toInt(d.descuentoGeneral)), totalImpreso: toInt(d.totalImpreso) || null, items: d.items, assign });
    closeDrawer(); render();
    await saveFactura(f); toast("Guardado"); return;
  }
  if (t.dataset.me) { S.me = t.dataset.me; lsSet("sam-me", S.me); render(); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; render(); return; }
  if (t.dataset.big) { S.big = t.dataset.big; render(); return; }
  if (t.dataset.expand) { S.open = S.open === t.dataset.expand ? null : t.dataset.expand; render(); return; }
  if (t.dataset.step || t.dataset.setn !== undefined) {
    const it = (f.items || []).find(x => x.id === t.dataset.sid); if (!it) return;
    const cur = portions(f, it)[S.me];
    setMine(f, it, t.dataset.step ? cur + Number(t.dataset.step) : Number(t.dataset.setn));
    render(); return;
  }
  if (t.dataset.item) {
    const o = ownerOf(f, t.dataset.item), other = S.me === "u1" ? "u2" : "u1";
    if (o === other) { toast(`Eso lo marcó ${nm(other)}. Cambiá a ${nm(other)} para editarlo.`); return; }
    queueAssign(f.id, t.dataset.item, o === S.me ? "s" : S.me);
    render(); return;
  }
  if (t.id === "doneBtn") {
    const done = { ...(f.done || {}) }, was = !!done[S.me]; done[S.me] = !was;
    f.done = done; render();
    await patchFactura(f.id, { done: { [S.me]: !was } });
    if (!was) { const other = S.me === "u1" ? "u2" : "u1"; toast(done[other] ? "Listo. Ya está todo separado." : `Guardado. Ahora le toca a ${nm(other)}.`); }
    return;
  }
  if (t.id === "editBtn") return openEdit(f);
  if (t.id === "attachBtn") { $("#attach").click(); return; }
  if (t.dataset.file !== undefined) { const a = (f.archivos || [])[+t.dataset.file]; if (a) openFile(a); return; }
  if (t.id === "copyBtn") {
    const c = calc(f);
    const txt = `${f.comercio || "Súper"} · ${fmtDate(f.fecha)}\nTotal: ${gs(c.total)}\n\n${nm("u1")}: ${gs(c.p1)} (propio ${gs(c.net.u1)} + mitad ${gs(c.net.s / 2)})\n${nm("u2")}: ${gs(c.p2)} (propio ${gs(c.net.u2)} + mitad ${gs(c.net.s / 2)})`;
    try { await navigator.clipboard.writeText(txt); toast("Resumen copiado"); }
    catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Resumen copiado"); } catch { toast("No se pudo copiar"); } ta.remove(); }
    return;
  }
  if (t.id === "delBtn") {
    if (!S.confirmDel) { S.confirmDel = true; render(); setTimeout(() => { if (S.confirmDel) { S.confirmDel = false; render(); } }, 4000); return; }
    S.confirmDel = false; S.facturas = S.facturas.filter(x => x.id !== f.id); S.view = "home"; render();
    await deleteFactura(f.id, (f.archivos || []).map(a => a.path)); toast("Factura borrada"); return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer();
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop") { e.preventDefault(); $("#file").click(); }
});
document.addEventListener("change", e => { if (e.target.id === "attach") { const f = getF(S.cur); const list = [...e.target.files]; e.target.value = ""; if (f) attachTo(f, list); return; } });
document.addEventListener("change", e => { if (e.target.id === "file") { S.error = null; addFiles(e.target.files); e.target.value = ""; if (S.view !== "home") { S.view = "home"; render(); } } });
document.addEventListener("submit", async e => {
  if (e.target.id === "loginForm") {
    e.preventDefault();
    const btn = $("#lg-btn"); btn.disabled = true; btn.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({ email: $("#lg-email").value.trim(), password: $("#lg-pass").value });
    if (error) { S.authError = /invalid/i.test(error.message) ? "Email o contraseña incorrectos." : "No se pudo entrar. Probá de nuevo."; render(); return; }
    S.authError = null; startApp(); return;
  }
  if (e.target.id !== "namesForm") return;
  e.preventDefault();
  const n = { u1: $("#nm1").value.trim() || "Usuario 1", u2: $("#nm2").value.trim() || "Usuario 2" };
  closeDrawer(); await saveNames(n); toast("Nombres guardados");
});
$("#drawer").addEventListener("click", e => { if (e.target.id === "drawer") closeDrawer(); });
document.addEventListener("dragover", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); S.error = null; addFiles(e.dataTransfer.files); } });

/* ---------- boot ---------- */
{ const th = lsGet("sam-theme", ""); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; }
paintThemeBtn();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn); } catch {}
render();
let started = false;
function startApp() {
  if (started) { S.auth = "in"; render(); return; }
  started = true;
  S.auth = "in"; S.loaded = true;
  db = makeDb(sb);
  db.collection("facturas").onSnapshot(snap => {
    S.facturas = snap.docs.map(d => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    render();
  }, () => toast("No se pudieron cargar las facturas."));
  db.doc("config/general").onSnapshot(snap => {
    const n = snap.exists ? snap.data()?.names : null;
    if (n) { S.names = { u1: n.u1 || "Usuario 1", u2: n.u2 || "Usuario 2" }; render(); }
  }, () => {});
  render();
}
(async () => {
  try {
    await loadScript(SBJS);
    sb = window.supabase.createClient(SB_URL, SB_KEY);
    const { data } = await sb.auth.getSession();
    if (data?.session) startApp(); else { S.auth = "out"; render(); }
  } catch {
    S.auth = "out"; S.authError = "No se pudo conectar con el servidor. Revisá tu internet y recargá la página."; render();
  }
})();
})();
</script>

</body></html>
